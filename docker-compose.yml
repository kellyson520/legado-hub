version: "3.8"

services:
  # Redis 缓存层
  redis:
    image: redis:7-alpine
    container_name: legado-hub-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - legado-hub-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MinIO 对象存储（可选，用于备份和AI结果存储）
  minio:
    image: minio/minio:latest
    container_name: legado-hub-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-legadohub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-legadohub-minio-password}
    command: server /data --console-address ":9001"
    networks:
      - legado-hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LegadoHub 主服务
  legado-hub:
    build: ./backend
    container_name: legado-hub
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./frontend:/app/frontend:ro
      - ./logs:/app/logs
    environment:
      - DB_PATH=/data/legado_hub.db
      - NOVEL_DB_PATH=/data/novel.db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-legado-hub-change-me-in-production}
      - PYTHONUNBUFFERED=1
      - DEBUG=false
      # MinIO 配置
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-legadohub}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-legadohub-minio-password}
      - MINIO_BUCKET=legado-hub
      # LLM 配置（可选）
      - LLM_API_URL=${LLM_API_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - legado-hub-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx 反向代理（生产环境）
  nginx:
    image: nginx:alpine
    container_name: legado-hub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/app/frontend:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - legado-hub
    networks:
      - legado-hub-net

volumes:
  redis_data:
  minio_data:

networks:
  legado-hub-net:
    driver: bridge
