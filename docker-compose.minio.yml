services:
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-legadohub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for MinIO}
    volumes:
      - ./data/minio:/data
    mem_limit: 256m
    networks:
      - internal

networks:
  internal:
    driver: bridge
